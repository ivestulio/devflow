[project]
name = "devflow"
version = "0.1.0"
description = "Agente de triagem e planejamento tecnico de issues"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-openai>=1.6,<2",
    "langchain-core>=1.0",
    "azure-search-documents>=11.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "mlflow>=3",
]

[dependency-groups]
# langgraph-api >= 0.11 e exigido pelo Studio para mostrar traces na propria UI
# (session-name tracing). Sem o piso, o resolvedor pode cair em 0.10.x.
dev = ["langgraph-cli[inmem]>=0.4", "langgraph-api>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# O pacote de import chama-se `src` (a arvore de pastas e fixa).
# Por isso todo import no projeto e absoluto: `from src.x import y`.
[tool.hatch.build.targets.wheel]
packages = ["src"]
